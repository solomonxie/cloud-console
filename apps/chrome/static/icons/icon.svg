<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="128" height="128">
  <!-- Vector redraw of the mobile app icon
       (apps/ios/CloudConsole/Assets.xcassets/AppIcon.appiconset/icon-light.png).
       The toolbar PNGs are rasterized from that PNG, not from this file;
       this copy is the glyph for scripts/gen_store_assets.py. -->
  <defs>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="229"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131731"/>
      <stop offset="0.45" stop-color="#25266a"/>
      <stop offset="1" stop-color="#3a2fa3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#34347f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34347f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde2fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0b0c2a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>

  <path filter="url(#shadow)" fill="url(#cloud)"
        d="M300,760 A128,128 0 0 1 172,632 L172,592 A128,128 0 0 1 300,464
           L300,440 A206,206 0 0 1 712,424 L722,424 A130,130 0 0 1 852,554
           L852,632 A128,128 0 0 1 724,760 Z"/>

  <polyline points="372,490 470,580 372,670" fill="none" stroke="#232261"
            stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="637" width="160" height="66" rx="33" fill="#0ab8d6"/>
</svg>
